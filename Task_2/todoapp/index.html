<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="app-container">

    <!--  HEADER  -->
    <h1 class="app-title">To Do List</h1>
    <p class="app-subtitle">Stay organized. Stay productive.</p>

    <!--  INPUT AREA  -->
    <div class="input-area">
      <input
        type="text"
        id="task-input"
        class="task-input"
        placeholder="Add a new task..."
      />
      <button id="add-btn" class="add-btn">+ Add</button>
    </div>

    <!--  ERROR MESSAGE (hidden by default)  -->
    <p class="error-msg" id="error-msg">⚠️ Please enter a task first!</p>

    <!--  TASK COUNTER  -->
    <div class="task-stats">
      <span id="task-count">0 tasks</span>
      <span id="completed-count">0 completed</span>
    </div>

    <!--  TASK LIST  -->
    <!-- JS will dynamically add <li> items here -->
    <ul class="task-list" id="task-list"></ul>

    <!--  EMPTY STATE (shown when no tasks)  -->
    <div class="empty-state" id="empty-state">
      <p>No tasks yet! Add one above.</p>
    </div>

  </div>

  <!-- JS loaded at the bottom so HTML is ready first -->
  <script src="app.js"></script>
</body>
</html>
