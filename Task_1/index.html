<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--  Tells mobile browsers: don't zoom out, fit the screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Landing Page</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Font for clean, modern look -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!--HEADER -->
  <header class="header">
    <div class="logo">Buildeas</div>

    <!-- Hamburger icon shown only on mobile -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle" />
    <label for="menu-toggle" class="hamburger">&#9776;</label>

    <nav class="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!--  HERO SECTION -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1>Build. Launch. <span>Grow.</span></h1>
      <p>
        We help developers and startups turn ideas into
        powerful, real-world web applications.
      </p>
      <!-- Call-To-Action Button -->
      <a href="#contact" class="btn">Get Started →</a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 Buildeas. All rights reserved.</p>

    <div class="social-links">
      <a href="#"> Twitter</a>
      <a href="#"> LinkedIn</a>
      <a href="#"> GitHub</a>
    </div>
  </footer>

</body>
</html>
